# 수집 소스 목록 — 음악인(가수·아이돌·래퍼·밴드·프로듀서 등) 이슈만 다룬다.
# URL 은 `python -m briefing verify` (verify 워크플로)로 동작을 확인하고, 죽은 소스는 enabled: false 로 끈다.
#
# type:
#   rss     - 일반 RSS/Atom
#   gnews   - Google 뉴스 RSS (제목 끝의 " - 매체명"을 떼고 <source>를 매체명으로 씀)
#   naver   - 네이버 검색 API(뉴스). NAVER_CLIENT_ID / NAVER_CLIENT_SECRET 시크릿이 있을 때만.
#             기사 요약문(description)을 줘서 국내 기사 요약이 구체적이 된다
#   youtube - YouTube Data API 인기 동영상 (YOUTUBE_API_KEY 시크릿이 있을 때만)
# filter: music  - 연예 전반·검색 결과처럼 음악 외 기사가 섞이는 소스에 음악 키워드 필터를 건다
#
# 한겨레 등 일반 매체 피드는 음악 기사 비중이 낮아 넣지 않았다.

categories:
  - key: music
    name: 음악

