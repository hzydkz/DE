# 수집 소스 목록.
# 아래 URL은 기억 기반 후보다. `python -m briefing verify` (또는 verify 워크플로)로
# 실제 동작 여부를 확인하고, 죽은 소스는 enabled: false 로 끄거나 지운다.
#
# type:
#   rss     - 일반 RSS/Atom
#   gnews   - Google 뉴스 RSS (제목 끝의 " - 매체명"을 떼고 <source>를 매체명으로 씀)
#   trends  - Google 트렌드 일간 인기 검색어 RSS
#   hn      - Hacker News (Algolia 검색 API, 전날 points 상위)
#   youtube - YouTube Data API 인기 동영상 (YOUTUBE_API_KEY 시크릿이 있을 때만)

categories:
  - key: general
    name: 종합
  - key: politics
    name: 정치
  - key: economy
    name: 경제
  - key: it
    name: IT
  - key: world
    name: 해외
  - key: community
    name: 커뮤니티
  - key: music
    name: 음악

